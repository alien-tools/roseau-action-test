name: Release check

# Compare main with a release tag, to choose the next version number.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to compare main with"
        default: "v1.0.0"

permissions:
  contents: read

jobs:
  roseau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: alien-tools/roseau-action@main
        id: roseau
        with:
          current: src/main/java
          pom: pom.xml
          config: roseau.yaml
          ignored: .roseau/accepted-breaks.csv
          baseline-ref: ${{ inputs.tag }}
          fail-on-breaking-changes: false
          roseau-version: v0.7.0

      - name: Suggest next version
        env:
          TAG: ${{ inputs.tag }}
          HAS_BC: ${{ steps.roseau.outputs.has-breaking-changes }}
          COUNT: ${{ steps.roseau.outputs.breaking-change-count }}
        run: |
          if [[ "$HAS_BC" == "true" ]]; then
            message="$COUNT breaking change(s) since $TAG: the next release must be a major version."
          else
            message="No breaking changes since $TAG: the next release can be a minor or patch version."
          fi
          echo "::notice::$message"
          printf '\n**Next release:** %s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
