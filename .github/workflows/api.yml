name: API compatibility

# On pull requests: compare the PR against its base branch and fail on breaking changes.
# On main: compare against the latest release tag and report what the next release implies.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: Breaking changes (sources)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out baseline
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ref="${BASE_SHA:-$(git describe --tags --abbrev=0)}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          git worktree add "$RUNNER_TEMP/baseline" "$ref"

      - uses: alien-tools/roseau-action@inline-annotations
        id: roseau
        with:
          baseline: ${{ runner.temp }}/baseline/src/main/java
          current: src/main/java
          v1-pom: ${{ runner.temp }}/baseline/pom.xml
          v2-pom: pom.xml
          config: roseau.yaml
          ignored: .roseau/accepted-breaks.csv
          reports: HTML=roseau-reports/report.html,CSV=roseau-reports/report.csv
          fail-on-breaking-changes: ${{ github.event_name == 'pull_request' }}
          roseau-version: v0.7.0

      - name: Suggest next version
        if: github.event_name != 'pull_request'
        env:
          BASELINE: ${{ steps.baseline.outputs.ref }}
          HAS_BC: ${{ steps.roseau.outputs.has-breaking-changes }}
          COUNT: ${{ steps.roseau.outputs.breaking-change-count }}
        run: |
          if [[ "$HAS_BC" == "true" ]]; then
            message="$COUNT breaking change(s) since $BASELINE: the next release must be a major version."
            echo "::warning::$message"
          else
            message="No breaking changes since $BASELINE: the next release can be a minor or patch version."
            echo "::notice::$message"
          fi
          printf '\n**Next release:** %s\n' "$message" >> "$GITHUB_STEP_SUMMARY"

  binary:
    name: Binary compatibility (JARs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Check out baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add "$RUNNER_TEMP/baseline" "${BASE_SHA:-$(git describe --tags --abbrev=0)}"

      - name: Build and test
        run: mvn --batch-mode verify

      - name: Build baseline
        run: mvn --batch-mode -DskipTests -f "$RUNNER_TEMP/baseline/pom.xml" package

      - uses: alien-tools/roseau-action@inline-annotations
        with:
          baseline: ${{ runner.temp }}/baseline/target/tiny-slug.jar
          current: target/tiny-slug.jar
          v1-pom: ${{ runner.temp }}/baseline/pom.xml
          v2-pom: pom.xml
          compatibility: binary
          config: roseau.yaml
          ignored: .roseau/accepted-breaks.csv
          report-dir: roseau-binary-reports
          upload-reports: false
          # The sources job already comments and annotates the pull request
          comment: false
          annotations: false
          fail-on-breaking-changes: ${{ github.event_name == 'pull_request' }}
          roseau-version: v0.7.0
